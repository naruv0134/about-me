<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개 | 박지은</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="card-header-deco"></div>
        
        <div class="card-body">
            <div class="avatar-container">
                <span class="avatar">📝</span>
            </div>
            
            <h1 class="name">박지은</h1>
            <p class="university">서울대학교 종교학과/정보문화학과</p>
            
            <hr class="divider">
            
            <p class="bio">
                안녕하세요! 저는 이전에 <strong>UX 설계 및 서비스 기획 프로젝트</strong>를 진행하며, AI Agent 설계에 깊은 관심이 생겨 이번 프로젝트에 함께하게 되었습니다.
            </p>
            <p class="bio highlight-text">
                높은 몰입도로 동료들과 함께 성장하는 시간이 되면 좋겠습니다. 감사합니다.
            </p>
            
            <div class="tags">
                <span class="tag">UX 설계</span>
                <span class="tag">서비스 기획</span>
                <span class="tag">AI Agent</span>
            </div>
            
            <button class="action-btn" onclick="alert('함께 멋진 프로젝트를 만들어가요! 🔥')">
                반갑습니다!
            </button>
        </div>
    </div>
</body>
</html>
